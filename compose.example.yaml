services:
  nginx:
    depends_on:
      - golang-example
      - nestjs-example
      - react-express-example
    environment:
      - PROXY_DIR=proxy_example
  golang-example:
    build:
      context: ./examples/golang
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - mysql
      - redis
    networks:
      - nginx-proxy
  nestjs-example:
    build:
      context: ./examples/nestjs
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - mysql
      - redis
    networks:
      - nginx-proxy
  react-express-example:
    build:
      context: ./examples/react-express
      dockerfile: Dockerfile
    restart: always
    networks:
      - nginx-proxy
  spiritchess.cn:
    build:
      context: ./spiritchess.cn
      dockerfile: Dockerfile
    restart: always
    networks:
      - nginx-proxy
networks:
  nginx-proxy:
    driver: bridge
